services:
  br-orakel-test:
    build:
      context: .
      args:
        ORAKEL_DEMO_RELEASE: ${ORAKEL_DEMO_RELEASE:-0}
        ORAKEL_BUILD_NUMBER: ${ORAKEL_BUILD_NUMBER:-}
        ORAKEL_VERSION: ${ORAKEL_VERSION:-}
        ORAKEL_ENVIRONMENT: ${ORAKEL_ENVIRONMENT:-test}
    ports:
      - "${BR_ORAKEL_BIND_ADDRESS:-127.0.0.1}:${BR_ORAKEL_HOST_PORT:-3002}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      APP_MODE: mock
      ENHETSREGISTERET_MODE: ${ENHETSREGISTERET_MODE:-live}
      ENHETSREGISTERET_API: ${ENHETSREGISTERET_API:-https://data.brreg.no/enhetsregisteret/api}
      ENHETSREGISTERET_TIMEOUT_MS: ${ENHETSREGISTERET_TIMEOUT_MS:-10000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-12000}
      OPENAI_MAX_CONTEXT_CHARS: ${OPENAI_MAX_CONTEXT_CHARS:-1000000}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      OPENAI_STORE_RESPONSES: ${OPENAI_STORE_RESPONSES:-false}
      SOURCE_RETRIEVAL_ENABLED: ${SOURCE_RETRIEVAL_ENABLED:-true}
      SOURCE_RETRIEVAL_TIMEOUT_MS: ${SOURCE_RETRIEVAL_TIMEOUT_MS:-2500}
      SOURCE_RETRIEVAL_MAX_SOURCES: ${SOURCE_RETRIEVAL_MAX_SOURCES:-2}
      SOURCE_RETRIEVAL_MAX_BYTES: ${SOURCE_RETRIEVAL_MAX_BYTES:-500000}
      SOURCE_RETRIEVAL_MAX_CHARS: ${SOURCE_RETRIEVAL_MAX_CHARS:-8000}
      OPPGAVEREGISTERET_MODE: ${OPPGAVEREGISTERET_MODE:-live}
      OPPGAVEREGISTERET_API: ${OPPGAVEREGISTERET_API:-https://data.brreg.no/oppgaveregisteret/api}
      OPPGAVEREGISTERET_PAGE_SIZE: ${OPPGAVEREGISTERET_PAGE_SIZE:-100}
      OPPGAVEREGISTERET_TIMEOUT_MS: ${OPPGAVEREGISTERET_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data-test:/app/data
    restart: unless-stopped
